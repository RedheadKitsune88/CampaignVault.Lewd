# Lewd Handbook — Recovery Dice (sexual history hit-dice analogue).
# Spent with lewd_recover after a climax or short rest (up to proficiency bonus; die + Con each). Core refills on long rest.
# The die differs per sexual history and lives on the character's recovery_die trait, so the pool carries no die.
name: recovery_dice
description: Recovery Dice remaining for post-climax / short-rest arousal reduction.
applicableSystems: [dnd5e]
recovery: LongRest
defaultMax: 1
maxFrom: { levelMultiplier: 1, min: 1 }   # one per level, as the former 1..20 table
