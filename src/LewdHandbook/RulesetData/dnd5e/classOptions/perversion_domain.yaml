# Cleric Perversion Domain (Lewd Handbook). A subclass option of the core cleric progression.
# Domain spell levels follow the usual 1/3/5/7 cleric pacing; adjust to the handbook if it differs.
name: perversion_domain
class: cleric
choice: subclass
label: Perversion Domain
description: Sacred depravity. Sinful Temptation, Profane Worship, Discover Depravity and a profane toolkit of sexual magic.
features:
  1:
    - name: Sinful Temptation
      description: Persuasion expertise for seduction.
    - name: Profane Worship
      description: Proficient in sexual implements, which serve as your holy symbol.
    - name: Domain Spells
      description: Always prepared, not counted against the spells you prepare.
      spells:
        1: [maddening_desire]
        3: [incite_lust]
        5: [suppress_inhibition]
        7: [instant_recovery]
  2:
    - name: "Channel Divinity: Discover Depravity"
      description: Touch; Wisdom save or flustered, and you learn a kink or secret.
  6:
    - name: Perverse Magic
      description: Reaction to swap a damage type among those listed.
  8:
    - name: Create Depravity
      description: Instead of damage, grant a temporary fetish.
  17:
    - name: Corruptive Climax
      description: Reaction when an adjacent creature climaxes; swap a resistance, immunity or vulnerability for 24 hours.
requires: { plugin: com.campaignvault.lewd-handbook }
