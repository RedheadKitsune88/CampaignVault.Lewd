description: >
  Bard College of Burlesque (Lewd Handbook). 3rd: Exotic Arts (sexual implements as bard focus; Performance for seduction);
  Salacious Performance (Performance ≥ spell save DC → Enthrall-like aura, bonus action to continue). 6th: Erotic Flourish
  (spend Bardic Inspiration on stim gain → psychic stim to witnesses); Enchanting Display (Salacious targets disadv vs your
  bard spells; allies adv vs charm/fear/hyperaroused/infatuated — replaces Countercharm). 14th: Stunning Finale (your climax
  stuns Salacious targets until end of their next turn; allies immune).
