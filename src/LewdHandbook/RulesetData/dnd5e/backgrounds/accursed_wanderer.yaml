name: accursed_wanderer
system: dnd5e
description: >
  Background (Lewd Handbook). You adventure under a powerful curse that remove curse cannot easily lift — often a
  Lustbrand or miscellaneous curse. Skill proficiencies: Investigation, Arcana. Languages: one exotic. Tool: one weapon
  or sexual implement. Equipment: traveler's clothes, dungeoneer's pack, one weapon or implement.
mechanicalSummary: >
  Feature Cursemarked: bear a lasting Lustbrand/curse (coordinate with DM). Feature Curse-sense: automatically sense
  presence (not nature) of curses on creatures/objects you touch. Suggested ideals/bonds/flaws in handbook.
requires: { plugin: com.campaignvault.lewd-handbook }
